# GripetteOS copy of what grabette:packages/gripette/Makefile ensure-ble-only
# writes: bluetoothd without its midi plugin. That plugin reads the BLE MIDI
# service of whatever connects (a Linux PC running PipeWire publishes one); it
# needs encryption, so the gripette asks the browser to pair, Chrome refuses,
# and the link drops before the setup page can do anything.
# The first ExecStart= clears the unit's own.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=midi
