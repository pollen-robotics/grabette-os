# GripetteOS override of /usr/lib/modprobe.d/rpi-brcmfmac.conf (same name, so
# this copy wins): the stock mask 0x282000 plus bit 25, SAE_EXT on 6.18.
# Without it the driver advertises WPA3 (SAE), NetworkManager appends SAE to
# every wpa-psk profile, and on a WPA2/WPA3 transition network the Zero 2W
# picks SAE, which its 43430 firmware cannot complete: "Authentication ...
# timed out" forever, no WPA2 fallback. WPA2-only networks are unaffected.
# Bit positions differ per kernel (6.12 wants 0x682000): verify-image.sh pins
# the kernel to 6.18. Drop this file once raspberrypi/linux#7634 is fixed.
options brcmfmac roamoff=1 feature_disable=0x2282000
