name: Generate Gripette OS Image

on:
  workflow_dispatch:
    inputs:
      gripette_ref:
        description: "grabette branch/tag to bake into the image"
        required: false
        default: "develop"
  push:
    tags:
      - '*'

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test bmap-tools kmod

      - name: Set TAG environment variable from git tag
        id: set_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Update stage2/05-gripette/00-run.sh to use TAG
        if: github.ref_type == 'tag'
        run: |
            sed -i "s/GripetteOS: dev/GripetteOS: ${{ env.TAG }}/g" stage2/05-gripette/00-run.sh

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Build Gripette OS image
        run: sudo -E ./build.sh
        env:
          # Fine-grained PAT with contents:read on pollen-robotics/grabette —
          # the workflow's default token cannot read a sibling private repo.
          GITHUB_TOKEN: ${{ secrets.GRABETTE_CLONE_TOKEN }}
          GRIPETTE_REF: ${{ inputs.gripette_ref || 'develop' }}

      - name: Rename deploy files with tag
        if: github.ref_type == 'tag'
        run: |
          for f in deploy/*.*; do
            ext="${f##*.}"
            base="${f%.*}"
            sudo mv "$f" "${base}-${TAG}.${ext}"
          done
        env:
          TAG: ${{ env.TAG }}

      - name: Upload generated image
        uses: actions/upload-artifact@v7
        with:
            name: gripetteos-image-${{ env.TAG || github.run_number }}
            path: deploy/*

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        with:
            files: deploy/*
            generate_release_notes: true
