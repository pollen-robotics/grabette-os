name: Generate Grabette OS Images

on:
  workflow_dispatch:
    inputs:
      grabette_ref:
        description: "grabette branch/tag to bake into the images"
        required: false
        default: "develop"
  push:
    tags:
      - '*'

jobs:
  build-image:
    # Native arm64: build.sh's `arch-test -n arm64` succeeds, so the chroot runs
    # without qemu emulation — the stage0/stage2 apt work is several times faster
    # than on an x86 runner. Free for public repos.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant: [gripette, grabette]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space
        # A stock runner has ~14 GB free on /; pi-gen keeps a full rootfs per
        # stage plus the raw .img, and the grabette rootfs (depthai, opencv,
        # rerun, gradio) blows past that during export-image. These toolchains
        # are unused here and free ~25-30 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup
          sudo docker image prune -af || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test bmap-tools kmod

      - name: Set TAG environment variable from git tag
        if: github.ref_type == 'tag'
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Build ${{ matrix.variant }} OS image
        run: sudo -E ./build.sh -c config.${{ matrix.variant }}
        env:
          GRABETTE_REF: ${{ inputs.grabette_ref || 'develop' }}
          OS_VERSION: ${{ env.TAG || 'dev' }}

      - name: Rename deploy files with tag
        if: github.ref_type == 'tag'
        run: |
          for f in deploy/*.*; do
            ext="${f##*.}"
            base="${f%.*}"
            sudo mv "$f" "${base}-${TAG}.${ext}"
          done
        env:
          TAG: ${{ env.TAG }}

      - name: Upload generated image
        uses: actions/upload-artifact@v7
        with:
            name: ${{ matrix.variant }}os-image-${{ env.TAG || github.run_number }}
            path: deploy/*

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        with:
            files: deploy/*
            generate_release_notes: true
